name: Web game and GitHub Pages

on:
  pull_request:
    paths:
      - 'web/**'
      - 'src/**'
      - 'tools/WebInteropServer.java'
      - 'tests/OnlineCorsTest.java'
      - 'LICENSE'
      - 'AUTHORS.md'
      - 'VERSION'
      - '*-web.ps1'
      - 'scripts/ProjectTools.ps1'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tools/WebInteropServer.java'
      - 'tests/OnlineCorsTest.java'
      - 'LICENSE'
      - 'AUTHORS.md'
      - 'VERSION'
      - '*-web.ps1'
      - 'scripts/ProjectTools.ps1'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned test dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated headless Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build and test production site, rules, CORS and browser flows
        shell: pwsh
        run: ./test-web.ps1 -SkipInstall
      - name: Upload tested Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/web/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing Pages site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

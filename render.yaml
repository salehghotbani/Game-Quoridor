# A deployment template only. Creating/deploying a service is a separate account action.
services:
  - type: web
    name: quoridor-room-server
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      # Exact web origins only. Empty by default; set explicitly before enabling a browser client.
      - key: QUORIDOR_ALLOWED_ORIGINS
        value: ""

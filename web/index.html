<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101827" />
    <meta
      name="description"
      content="Play Quoridor: local two or four players, three robot levels and a hands-on visual tutorial. English and Persian."
    />
    <title>Quoridor · Play</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body data-screen="menu">
    <a class="skip-link" href="#main" data-i18n="skip">Skip to game</a>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Quoridor home"
          ><img src="./icon.svg" alt="" width="36" height="36" /><span
            >QUORIDOR</span
          ></a
        >
        <div class="preferences">
          <label
            ><span class="sr-only" data-i18n="language">Language</span
            ><select id="language" aria-label="Language">
              <option value="en">English</option>
              <option value="fa">فارسی</option>
            </select></label
          >
          <label
            ><span class="sr-only" data-i18n="appearance">Appearance</span
            ><select id="theme" aria-label="Appearance">
              <option value="dark" data-i18n="dark">Dark</option>
              <option value="light" data-i18n="light">Light</option>
            </select></label
          >
          <button id="about-toggle" class="quiet" data-i18n="about">
            About
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <p
          id="notice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <section id="menu-view" aria-labelledby="welcome-heading">
          <div class="intro">
            <h1 id="welcome-heading">Quoridor</h1>
            <p data-i18n="intro">Reach the opposite edge.</p>
          </div>
          <section class="card setup-card" aria-labelledby="welcome-heading">
            <form id="setup-form">
              <label class="field"
                ><span data-i18n="gameMode">Game mode</span
                ><select id="mode">
                  <option value="LOCAL2" data-i18n="local2">Two players</option>
                  <option value="LOCAL4" data-i18n="local4">
                    Four players
                  </option>
                  <option value="BOT" data-i18n="vsBot">
                    Play against a robot
                  </option>
                </select></label
              >
              <label class="field" id="difficulty-field" hidden
                ><span data-i18n="difficulty">Robot strength</span
                ><select id="difficulty">
                  <option value="EASY" data-i18n="easy">Easy</option>
                  <option value="MEDIUM" data-i18n="medium" selected>
                    Medium
                  </option>
                  <option value="HARD" data-i18n="hard">Hard</option>
                </select></label
              >
              <details id="name-settings">
                <summary data-i18n="names">Player names</summary>
                <div class="name-grid">
                  <label class="field"
                    ><span data-i18n="blue">Blue</span
                    ><input
                      id="name-0"
                      maxlength="48"
                      autocomplete="off"
                      data-placeholder="blue"
                  /></label>
                  <label class="field"
                    ><span data-i18n="green">Green</span
                    ><input
                      id="name-1"
                      maxlength="48"
                      autocomplete="off"
                      data-placeholder="green"
                  /></label>
                  <label class="field extra-player" hidden
                    ><span data-i18n="red">Red</span
                    ><input
                      id="name-2"
                      maxlength="48"
                      autocomplete="off"
                      data-placeholder="red"
                  /></label>
                  <label class="field extra-player" hidden
                    ><span data-i18n="gold">Gold</span
                    ><input
                      id="name-3"
                      maxlength="48"
                      autocomplete="off"
                      data-placeholder="gold"
                  /></label>
                </div>
              </details>
              <button
                id="start-game"
                class="primary wide"
                type="submit"
                data-i18n="start"
              >
                Start game
              </button>
            </form>
            <button
              id="tutorial-menu"
              class="wide tutorial-entry"
              data-i18n="learn"
            >
              Learn by playing
            </button>
            <div class="split-buttons">
              <button id="continue-game" disabled data-i18n="continue">
                Continue</button
              ><button id="load-game" data-i18n="load">Load file</button>
            </div>
          </section>
        </section>
        <section id="game-view" hidden aria-labelledby="turn-status">
          <div class="game-heading">
            <button id="new-game" class="quiet" data-i18n="menu">Menu</button
            ><span id="match-kind" class="eyebrow"></span
            ><button id="tutorial-game" class="quiet" data-i18n="howTo">
              How to play</button
            ><button id="save-game" data-i18n="save">Save file</button>
          </div>
          <div class="match-layout">
            <section class="board-card card">
              <div class="turn-heading">
                <span class="status-dot" id="turn-dot"></span>
                <h1 id="turn-status" aria-live="polite"></h1>
              </div>
              <div id="round-result" class="round-result" hidden>
                <button id="replay-game" class="primary" data-i18n="playAgain">
                  Play again
                </button>
              </div>
              <button id="bot-retry" hidden data-i18n="botRetry">
                Retry robot
              </button>
              <div class="board-frame">
                <div
                  id="board"
                  role="grid"
                  aria-label="Quoridor board"
                  aria-rowcount="9"
                  aria-colcount="9"
                ></div>
              </div>
              <p id="board-instruction" class="board-instruction"></p>
            </section>
            <aside class="match-sidebar">
              <section class="card"><div id="wall-counts"></div></section>
              <section class="card tools">
                <div class="split-buttons history-tools">
                  <button id="undo" data-i18n="undo">Undo</button
                  ><button id="redo" data-i18n="redo">Redo</button
                  ><button id="hint" data-i18n="hint">Hint</button>
                </div>
                <button
                  id="show-history"
                  class="history-toggle"
                  aria-expanded="false"
                  aria-controls="history-list"
                  data-i18n="history"
                >
                  Move history
                </button>
                <ol id="history-list" hidden></ol>
              </section>
            </aside>
          </div>
        </section>
      </main>
      <footer>
        <span>Quoridor <span id="app-version"></span></span
        ><a
          href="https://github.com/salehghotbani/Game-Quoridor"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </footer>
    </div>
    <input id="save-file-input" type="file" accept=".qsave,text/plain" hidden />
    <dialog id="tutorial-dialog" aria-labelledby="lesson-title">
      <div class="dialog-heading">
        <span id="lesson-progress" class="eyebrow"></span
        ><button id="tutorial-close" data-i18n="close">Close</button>
      </div>
      <h2 id="lesson-title"></h2>
      <p id="lesson-prompt" aria-live="polite"></p>
      <div class="board-frame">
        <div
          id="lesson-board"
          role="grid"
          aria-rowcount="9"
          aria-colcount="9"
        ></div>
      </div>
      <div class="lesson-navigation">
        <button id="lesson-back" data-i18n="back">Back</button
        ><span id="lesson-feedback" role="status"></span
        ><button id="lesson-next" class="primary" data-i18n="next">Next</button>
      </div>
    </dialog>
    <dialog id="about-dialog" aria-labelledby="about-title">
      <div class="dialog-heading">
        <h2 id="about-title" data-i18n="about">About</h2>
        <button id="about-close" data-i18n="close">Close</button>
      </div>
      <p data-i18n="aboutText">
        An open-source Quoridor game for the web, Android and desktop.
      </p>
      <ol dir="rtl">
        <li>سیدمحمدصالح قطبانی</li>
        <li>محمدجواد بنان</li>
        <li>امیرمحمد خسروی</li>
      </ol>
      <p>
        <a href="./LICENSE">MIT License</a> ·
        <a href="./AUTHORS.md" data-i18n="authors">Authors</a>
      </p>
      <pre id="license-text"></pre>
    </dialog>
    <noscript
      ><p>
        This game requires JavaScript. این بازی به JavaScript نیاز دارد.
      </p></noscript
    >
  </body>
</html>
